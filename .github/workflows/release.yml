name: Release

on:
  release:
    types: [published]
permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

  release:
    needs: test
    permissions:
      contents: write  # to upload release asset (actions/upload-release-asset)

    name: Release tmux-project
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [386, amd64, arm64]
        exclude:
          - goos: darwin
            goarch: 386

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Prepare build directory
        run: |
          mkdir -p build/${{ matrix.goos }}.${{ matrix.goarch }}

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ./build.sh buildr ${{ matrix.goos }} ${{ matrix.goarch }} $GITHUB_WORKSPACE/build

      - name: Verify binary platforms
        run: |
          # every binary must be built for the platform its package is named after
          fail=0
          for binary in build/${{ matrix.goos }}.${{ matrix.goarch }}/*; do
            goos="$(go version -m "${binary}" | awk '$1 == "build" && $2 ~ /^GOOS=/ { sub(/^GOOS=/, "", $2); print $2 }')"
            goarch="$(go version -m "${binary}" | awk '$1 == "build" && $2 ~ /^GOARCH=/ { sub(/^GOARCH=/, "", $2); print $2 }')"
            echo "${binary}: ${goos}/${goarch}"
            if [[ "${goos}" != "${{ matrix.goos }}" || "${goarch}" != "${{ matrix.goarch }}" ]]; then
              echo "::error file=${binary}::built for ${goos}/${goarch}, expected ${{ matrix.goos }}/${{ matrix.goarch }}"
              fail=1
            fi
          done
          exit "${fail}"

      - name: Create package
        id: package
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          PACKAGE_NAME=tmux-project.${VERSION#tmux-project-}.${{ matrix.goos }}.${{ matrix.goarch }}.tar.gz
          tar -czvf $PACKAGE_NAME -C build/${{ matrix.goos }}.${{ matrix.goarch }} .
          echo "name=${PACKAGE_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate checksum
        run: |
          sha256sum ${{ steps.package.outputs.name }} > ${{ steps.package.outputs.name }}.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
