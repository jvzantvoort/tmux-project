name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Verify dependencies
      run: go mod verify

    - name: Check go.mod and go.sum are tidy
      run: go mod tidy -diff

    - name: Run go vet
      run: go vet ./...

    - name: Run staticcheck
      run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

    - name: Run tests
      run: go test -race -vet=off -coverprofile=coverage.out ./...

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.out
        flags: unittests
        fail_ci_if_error: false

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Run govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [386, amd64, arm64]
        exclude:
          - goos: darwin
            goarch: 386
    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache: true

    # same build path as the release workflow
    - name: Build
      run: ./build.sh buildr ${{ matrix.goos }} ${{ matrix.goarch }} "$GITHUB_WORKSPACE/build"

    - name: Verify binary platforms
      run: ./scripts/verify-binaries.sh ${{ matrix.goos }} ${{ matrix.goarch }} build/${{ matrix.goos }}.${{ matrix.goarch }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: tmux-project-${{ matrix.goos }}-${{ matrix.goarch }}
        path: build/${{ matrix.goos }}.${{ matrix.goarch }}
        retention-days: 7
